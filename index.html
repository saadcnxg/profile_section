<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile card studio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050505;--panel:#0d0d0d;--card:#0f0f0f;--line:#1f1f1f;--fg:#fff;--mu:#8a8a8a;--chrome:conic-gradient(from 0deg,#fff,#555 25%,#d8d8d8 50%,#444 75%,#fff);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;display:flex;min-height:100vh}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
aside{width:200px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh}
aside b{display:block;font-size:18px;margin:0 8px 28px}
aside a{display:block;padding:10px 12px;border-radius:10px;color:var(--mu);text-decoration:none;font-size:14px;margin-bottom:4px}
aside a.on{background:#1a1a1a;color:#fff}
main{flex:1;min-width:0;padding:28px clamp(16px,3vw,40px)}
h1{font-size:28px;margin:0 0 4px;font-weight:700}
.sub{color:var(--mu);font-size:14px;margin:0 0 24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:36px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat small{color:var(--mu);font-size:12px}
.stat div{font-size:26px;font-weight:700;margin-top:6px}
.bar{height:4px;background:#222;border-radius:4px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;width:68%;background:#ddd}
h2{font-size:18px;margin:0 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;margin-top:20px}
.slot{display:flex;flex-direction:column;gap:10px}
.slot>.cap{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu)}
.slot button{background:none;border:1px solid var(--line);color:var(--mu);border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.slot button:hover,.slot button:focus-visible{color:#fff;border-color:#666;outline:none}
.slot.sel button{background:#fff;color:#000;border-color:#fff}
.card{position:relative;height:290px;background:var(--card);border:1px solid #1a1a1a;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;isolation:isolate}
.card .gear{position:absolute;top:16px;right:18px;width:20px;height:20px;color:#6b6b6b}
.av{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:28px;position:relative}
.name{font-weight:700;font-size:18px;margin-top:22px}
.plan{margin-top:8px;font-size:14px;color:var(--mu);letter-spacing:.04em}
.plan u{text-underline-offset:5px;text-decoration-color:#555}
.v1 .av{border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#fff,#444 45%,#bbb) border-box}
.av.spin::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--chrome);animation:sp 5s linear infinite;-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
@keyframes sp{to{transform:rotate(360deg)}}
.v3{background:radial-gradient(260px circle at var(--x,50%) var(--y,30%),#2a2a2a,var(--card) 70%)}
.v3 .av{background:#000;border:1px solid #444}
.v4{flex-direction:row;gap:18px;padding:0 24px;text-align:left;justify-content:flex-start}
.v4 .av{width:84px;height:84px;font-size:22px;flex:none;border:2px solid #ddd;box-shadow:0 0 0 6px #151515}
.v4 .name{margin-top:0}.v4 .bar{width:140px}
.v5{border-radius:16px;justify-content:flex-start;padding-top:0}
.v5 .hole{width:54px;height:8px;border-radius:8px;background:#000;border:1px solid #2a2a2a;margin:14px 0 18px}
.v5 .av{border-radius:14px;width:92px;height:92px;background:#1a1a1a;border:1px solid #333}
.v5 .name{margin-top:16px}
.v5 .code{position:absolute;bottom:14px;left:20px;right:20px;height:26px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 5px,transparent 5px 8px,#fff 8px 11px,transparent 11px 13px);opacity:.75}
.v5 .plan{margin-top:6px}
.v6{border-radius:6px;background:#0a0a0a}
.v6 .av{border-radius:0;background:#141414;border:1px solid #333}
.v6 .av::before,.v6 .av::after{content:"";position:absolute;width:14px;height:14px;border:2px solid #fff}
.v6 .av::before{top:-6px;left:-6px;border-right:0;border-bottom:0}
.v6 .av::after{bottom:-6px;right:-6px;border-left:0;border-top:0}
.v7::before{content:"UM";position:absolute;font-size:200px;font-weight:700;color:#151515;z-index:-1;letter-spacing:-.06em;bottom:-40px;right:-10px;line-height:1}
.v7{align-items:flex-start;text-align:left;padding:0 28px}
.v7 .av{width:76px;height:76px;font-size:22px;border:1px solid #fff;border-radius:50%}
.v7 .name{font-size:24px}
.orb{position:absolute;inset:-18px;border:1px dashed #333;border-radius:50%;animation:sp 12s linear infinite}
.orb::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff}
.v8 .av{background:#000;border:2px solid #2a2a2a}
.ring{position:absolute;inset:-8px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .t{stroke:#222}.ring .p{stroke:#fff;stroke-linecap:round;stroke-dasharray:314;stroke-dashoffset:314;animation:fill 1.6s .2s ease-out forwards}
@keyframes fill{to{stroke-dashoffset:94}}
.v9 .av{background:#141414}
.v10{background:linear-gradient(160deg,#1c1c1c,#090909);border-color:#2c2c2c}
.v10::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.12) 50%,transparent 65%);transform:translateX(-120%);transition:transform .9s}
.v10:hover::after{transform:translateX(120%)}
.v10 .av{background:rgba(255,255,255,.05);border:1px solid #555;box-shadow:inset 0 0 24px rgba(255,255,255,.08),0 12px 30px #000}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media(max-width:720px){aside{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.ring .p{stroke-dashoffset:94}}
</style>
</head>
<body>
<aside><b>Umerhammaz</b><a class="on" href="#">Overview</a><a href="#">Usage</a><a href="#">Projects</a><a href="#">Billing</a><a href="#">Settings</a></aside>
<main>
<h1>Hi, Umerhammaz</h1>
<p class="sub">Your account at a glance.</p>
<div class="stats">
<div class="stat"><small>Messages today</small><div>248</div></div>
<div class="stat"><small>Active projects</small><div>12</div></div>
<div class="stat"><small>Usage this month</small><div>68%</div><div class="bar"><i></i></div></div>
<div class="stat"><small>Plan</small><div>Pro</div></div>
</div>
<h2>Profile card designs</h2>
<p class="sub">Ten takes on the same card, same black and chrome palette. Pick one and tap Use this.</p>
<div class="grid" id="grid"></div>
</main>
<div class="toast" id="toast"></div>
<script>
var gear='<svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
var plan='<div class="plan mono">PRO • <u>Unlimited</u></div>';
var nm='<div class="name">Hi, Umerhammaz</div>';
var cards=[
['Original','v1',gear+'<div class="av">UM</div>'+nm+plan],
['Chrome spin','v2',gear+'<div class="av spin"><span>UM</span></div>'+nm+plan],
['Spotlight','v3',gear+'<div class="av">UM</div>'+nm+plan],
['Side by side','v4','<div class="av">UM</div><div><div class="name">Hi, Umerhammaz</div>'+plan+'<div class="bar"><i></i></div></div>'],
['ID badge','v5','<div class="hole"></div><div class="av">UM</div>'+nm+plan+'<div class="code"></div>'],
['Viewfinder','v6',gear+'<div class="av">UM</div>'+nm+plan],
['Watermark','v7',gear+'<div class="av">UM</div>'+nm+plan],
['Orbit','v8',gear+'<div class="av"><div class="orb"></div>UM</div>'+nm+plan],
['Usage ring','v9',gear+'<div class="av"><svg class="ring" viewBox="0 0 120 120" width="120" height="120"><circle class="t" cx="60" cy="60" r="50"/><circle class="p" cx="60" cy="60" r="50"/></svg>UM</div>'+nm+plan],
['Glass shine','v10',gear+'<div class="av">UM</div>'+nm+plan]
];
var g=document.getElementById('grid'),t=document.getElementById('toast');
cards.forEach(function(c,i){
  var s=document.createElement('div');s.className='slot';
  s.innerHTML='<div class="cap"><span>'+(i+1)+'. '+c[0]+'</span><button type="button">Use this</button></div><div class="card '+c[1]+'">'+c[2]+'</div>';
  s.querySelector('button').onclick=function(){
    document.querySelectorAll('.slot').forEach(function(x){x.classList.remove('sel')});
    s.classList.add('sel');t.textContent='Selected: '+c[0];t.classList.add('show');
    setTimeout(function(){t.classList.remove('show')},1600);
  };
  g.appendChild(s);
});
var v3=document.querySelector('.v3');
v3.addEventListener('pointermove',function(e){var r=v3.getBoundingClientRect();v3.style.setProperty('--x',(e.clientX-r.left)+'px');v3.style.setProperty('--y',(e.clientY-r.top)+'px')});
</script>
</body>
</html>
